<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarsNet-RL | Autonomous Orbital Routing</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            background-color: #0e1117;
            color: #ffffff;
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background: #161920;
            border-right: 1px solid #2d3342;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }
        .main-panel {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #07090e;
            border-radius: 12px;
            border: 1px solid #2d3342;
        }
        .btn {
            background: #ff4b4b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-secondary {
            background: #374151;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .control-group {
            background: #1e222b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d3342;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MarsNet-RL Control</h2>
        
        <div class="control-group">
            <button id="start-btn" class="btn" style="width: 100%;">Start Simulation</button>
        </div>

        <div class="control-group" style="display: flex; align-items: center; gap: 10px;">
            <button id="btn-chaos" class="btn" style="flex-grow: 1;">Inject Space Debris</button>
            <button id="debris-increment-btn" class="btn-secondary" style="display: none;" title="Add More Debris">▲</button>
        </div>

        <div class="control-group">
            <h3>Metrics</h3>
            <p>Score: <span id="score-val">1000</span></p>
            <p>Avoidances: <span id="avoidance-val">0</span></p>
            <p>Time Elapsed: <span id="time-val">0.0</span>s</p>
        </div>
    </div>

    <div class="main-panel">
        <canvas id="simCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const socket = io();
        let isRunning = false;
        let debrisEverInjected = false;
        let currentDebris = [];
        let satellites = [];

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        document.getElementById('start-btn').addEventListener('click', () => {
            isRunning = !isRunning;
            document.getElementById('start-btn').innerText = isRunning ? "Pause Simulation" : "Start Simulation";
            socket.emit('toggle_simulation', { running: isRunning });
        });

        // 1. First click reveals the up-arrow button and sends first injection across all 4 orbits
        document.getElementById('btn-chaos').addEventListener('click', () => {
            debrisEverInjected = true;
            document.getElementById('debris-increment-btn').style.display = 'inline-block';
            socket.emit('inject_chaos');
        });

        // 2. Up-arrow button click adds more debris across all 4 orbits
        document.getElementById('debris-increment-btn').addEventListener('click', () => {
            if (debrisEverInjected) {
                socket.emit('inject_chaos');
            }
        });

        socket.on('state_update', (state) => {
            isRunning = state.running;
            satellites = state.satellites || [];
            document.getElementById('score-val').innerText = state.score;
            document.getElementById('avoidance-val').innerText = state.avoidances;
            document.getElementById('time-val').innerText = state.time_elapsed.toFixed(1);
            document.getElementById('start-btn').innerText = isRunning ? "Pause Simulation" : "Start Simulation";
        });

        socket.on('update_debris', (debrisList) => {
            currentDebris = debrisList;
            debrisEverInjected = true;
            document.getElementById('debris-increment-btn').style.display = 'inline-block';
        });

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Draw Mars center planet body
            ctx.fillStyle = '#c1440e';
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, 2 * Math.PI);
            ctx.fill();

            // Draw all 4 orbital shell tracks as guides (matching radii: 80, 140, 200, 260)
            const shellRadii = [80, 140, 200, 260];
            ctx.strokeStyle = '#1f293d';
            ctx.lineWidth = 1.5;
            shellRadii.forEach(r => {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.stroke();
            });

            // Draw Satellites
            satellites.forEach(sat => {
                const sx = cx + sat.x;
                const sy = cy + sat.y;
                ctx.fillStyle = '#3b82f6';
                ctx.beginPath();
                ctx.arc(sx, sy, 3.5, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Draw Purple Debris Orbs across all orbitals only if injected
            if (debrisEverInjected) {
                currentDebris.forEach(deb => {
                    const dx = cx + deb.radius * Math.cos(deb.angle);
                    const dy = cy + deb.radius * Math.sin(deb.angle);

                    ctx.fillStyle = '#a855f7'; // Purple space debris
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(dx, dy, 5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.shadowBlur = 0; // reset
                });
            }

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
